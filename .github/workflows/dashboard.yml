name: dashboard

# Paths the app never reads at build or run time. NOT ignored on purpose:
# prompts/*.md (loaded by lib/analyze/*), reports/** (served by /runs and the
# product lookup), and every *.md under app/ or lib/.
# A skipped run on a main push also skips the collaborator deploy hook below;
# that is fine because nothing in these paths changes the deployed site.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "scripts/experiments/**"
      - "pipeline_v2_demo.excalidraw"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "scripts/experiments/**"
      - "pipeline_v2_demo.excalidraw"
      - ".claude/**"
  # Nightly full run, so a dependency or Chromium update that breaks the suite
  # surfaces even in a week with only docs pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pipeline.selftest imports sources.europepmc -> sources.http -> httpx.
      # Without this the suite dies on ModuleNotFoundError partway through, which
      # is why this workflow was red on every push from its creation until
      # 2026-08-10 and never once ran the checks it claims to gate on.
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Pipeline selftest
        env:
          PYTHONUTF8: "1"
        run: python -m pipeline.selftest

  dashboard:
    runs-on: ubuntu-latest
    needs: deterministic-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Unused files, exports and dependencies (knip.json). Clean as of
      # 2026-10-03; non-blocking so a stray export never holds up a deploy,
      # but a new finding shows in the job log.
      - name: Dead-code report (knip)
        continue-on-error: true
        run: npm run knip
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-aykhan-main:
    needs: dashboard
    if: >-
      ${{ success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'aykhanstoic' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is missing"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST \
            --url "$VERCEL_DEPLOY_HOOK_URL"
