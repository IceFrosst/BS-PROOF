name: dashboard

# The Next.js app's gates. Only paths the app builds from or its tests read:
# the Python pipeline has its own workflow (selftest.yml). prompts/, schemas/
# and vocab/ are here because lib/analyze/* loads them; tests/golden_*.json
# because the TS ports are pinned to them.
# A skipped run on a main push also skips the collaborator deploy hook below;
# that is fine because nothing outside these paths changes the deployed site.
on:
  push:
    paths: &app_paths
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "prompts/**"
      - "schemas/**"
      - "vocab/**"
      - "reports/runs/**"
      - "tests/**/*.ts"
      - "tests/**/*.tsx"
      - "tests/golden_*.json"
      - "tests/fixtures/**"
      - "scripts/*.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "eslint.config.*"
      - "knip.json"
      - "vercel.json"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths: *app_paths
  # Nightly full run, so a dependency or Chromium update that breaks the suite
  # surfaces even in a week with only docs pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Unused files, exports and dependencies (knip.json). Clean as of
      # 2026-10-03; non-blocking so a stray export never holds up a deploy,
      # but a new finding shows in the job log.
      - name: Dead-code report (knip)
        continue-on-error: true
        run: npm run knip
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-aykhan-main:
    needs: dashboard
    if: >-
      ${{ success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'aykhanstoic' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is missing"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST \
            --url "$VERCEL_DEPLOY_HOOK_URL"
