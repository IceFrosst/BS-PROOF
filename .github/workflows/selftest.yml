name: selftest

# Only paths that can change a deterministic Python result. The TypeScript
# ports are pinned to Python goldens by tests/analyze-parity.test.ts, which runs
# in dashboard.yml.
on:
  push:
    paths:
      - "pipeline/**"
      - "sources/**"
      - "bsproof/**"
      - "vocab/**"
      - "prompts/**"
      - "schemas/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "tests/fixtures/dashboard/**"
      - "reports/run_statuses.json"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/selftest.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "sources/**"
      - "bsproof/**"
      - "vocab/**"
      - "prompts/**"
      - "schemas/**"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "tests/fixtures/dashboard/**"
      - "reports/run_statuses.json"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/selftest.yml"
  workflow_dispatch:

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # See dashboard.yml: selftest needs httpx transitively. Missing until
      # 2026-08-10; this workflow had never been green.
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest vulture
      - name: Validate schemas parse
        run: python -c "import json,glob; fs=glob.glob('schemas/*.json'); [json.load(open(f)) for f in fs]; print(len(fs), 'schemas ok')"
      # Replaces two text-matching gates that both failed for the same reason:
      # a grep for "claude_adapter" in pipeline/ (which flagged the legitimate
      # test-only import at pipeline/selftest.py:1262 and so was red on every
      # push after 30b768f), and a re.findall over the AGENTS dict (which broke
      # if anyone reformatted it). pipeline/invariants.py reads the AST, so
      # aliasing, line wrapping and nesting cannot hide an import, and its
      # allowlist requires a reason and fails when it goes stale.
      - name: Structural invariants (model boundary, agent wiring)
        run: python -m pipeline.invariants
      - name: Deterministic regression
        run: |
          set -o pipefail
          python -m pipeline.selftest 2>&1 | tee selftest-log.txt
      # The unittest suites in tests/*.py (dashboard artifact writer, SR wiring,
      # universal-negative repair, S7 drift guard). Never run in CI before
      # 2026-10-03; jsonschema from requirements.txt is what they need.
      - name: Python tests
        run: python -m pytest -q tests/
      # Non-blocking dead-code report. At confidence 80 only certain findings
      # print; the 60% tier is mostly dataclass fields and founder constants
      # that are kept on purpose (2026-10-03 triage, docs/history/project-log.md).
      - name: Dead-code report (vulture)
        continue-on-error: true
        run: vulture pipeline sources scripts *.py --min-confidence 80
      - name: Upload selftest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest-log.txt
